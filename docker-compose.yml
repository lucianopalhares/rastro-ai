
services:
  vector-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rastro
      POSTGRES_USER: rastro
      POSTGRES_PASSWORD: rastro
    ports:
      - '${VECTOR_DB_PORT:-55432}:5432'
    volumes:
      - rastro_vector_db:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rastro -d rastro']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./rastro-api
      dockerfile: Dockerfile.dev
    command: npm run start:dev
    environment:
      NODE_ENV: development
      PORT: 3000
      CORS_ORIGIN: '*'
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '3039:3000'
    volumes:
      - ./rastro-api:/app
      - /app/node_modules
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/api/v1/health').then((response) =>
          process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  rastro_vector_db:
