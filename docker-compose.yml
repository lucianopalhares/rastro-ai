
services:
  vector-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rastro
      POSTGRES_USER: rastro
      POSTGRES_PASSWORD: rastro
    ports:
      - '${VECTOR_DB_PORT:-55432}:5432'
    volumes:
      - rastro_vector_db:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rastro -d rastro']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./rastro-api
      dockerfile: Dockerfile.dev
    command: npm run start:debug
    environment:
      NODE_ENV: development
      PORT: 3000
      CORS_ORIGIN: '*'
      CHOKIDAR_USEPOLLING: 'true'
      AI_INDEXING_URL: http://ai-indexer:8000/index
      AI_INDEXING_TIMEOUT_MS: '60000'
    ports:
      - '3039:3000'
      - '9229:9229'
    volumes:
      - ./rastro-api:/app
      - /app/node_modules
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/api/v1/health').then((response) =>
          process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ai-indexer:
    build:
      context: ./rastro-ai
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: python -Xfrozen_modules=off -m debugpy --listen 0.0.0.0:5678 -m rastro_ai.service
    environment:
      PYTHONPATH: /app/src
      AI_PORT: 8000
      VECTOR_STORE_BACKEND: postgres
      DATABASE_URL: postgresql://rastro:rastro@vector-db:5432/rastro
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_MODEL: text-embedding-3-small
      EMBEDDING_DIMENSIONS: '384'
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse-web:3000}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    depends_on:
      vector-db:
        condition: service_healthy
    ports:
      - '${AI_INDEXER_PORT:-18473}:8000'
      - '5678:5678'
    healthcheck:
      test: ['CMD-SHELL', 'python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\")"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  rastro_vector_db:
