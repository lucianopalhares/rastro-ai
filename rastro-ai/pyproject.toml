[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rastro-ai"
version = "0.1.0"
description = "Document extraction and indexing primitives for Rastro AI"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "tiktoken>=0.9,<1",
    "langchain-text-splitters>=0.3,<1",
    "langchain-openai>=1,<2",
    "langchain-postgres>=0.0.19,<1",
    "langgraph>=1,<2",
    "langfuse>=5,<6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
