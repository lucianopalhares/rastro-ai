[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rastro-ai"
version = "0.1.0"
description = "Document extraction and indexing primitives for Rastro AI"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "tiktoken>=0.9,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
